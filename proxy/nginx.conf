# Upstream for the frontend service
    upstream frontend {
        server frontend:80;
    }

    # Upstream for the Node.js backend service
    upstream node_backend {
        server node-backend:5000;
    }

    # Upstream for the Python AI/ML service
    upstream python_service {
        server python-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # No trailing slash: keep the /api prefix, because the Node routes are mounted under /api
            proxy_pass http://node_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 50M;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # The Python service is deliberately not exposed here: all traffic goes
        # through the Node backend so /api/forecast always requires a login.

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }